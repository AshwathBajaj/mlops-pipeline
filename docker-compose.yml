services:
  mlflow:
    build: .
    image: payguard:local
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  api:
    build: .
    image: payguard:local
    depends_on:
      - mlflow
    command: uvicorn payguard.serving.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PAYGUARD_MODEL_PATH: /app/models/model.joblib
    volumes:
      - ./models:/app/models:ro

volumes:
  mlflow_data:
