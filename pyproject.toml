[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payguard"
version = "0.1.0"
description = "End-to-end MLOps pipeline for payment-card fraud detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashwath Bajaj" }]
keywords = ["mlops", "fraud-detection", "xgboost", "mlflow", "fastapi"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pandera>=0.20",
  "mlflow>=2.16",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "shap>=0.46",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
  "fpdf2>=2.7",
]

[project.scripts]
payguard = "payguard.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["payguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
