seed: 7

data:
  source: synthetic
  n_rows: 2500
  target_fraud_rate: 0.04
  output_path: data/raw/transactions_ci.csv
  url: https://example.invalid/payguard-transactions.csv
  download_path: data/raw/downloaded.csv
  timeout_seconds: 5

split:
  test_size: 0.25

training:
  cv_folds: 3
  precision_target: 0.40
  shap_sample_size: 200
  models:
    logistic_regression:
      C: 1.0
      max_iter: 200
    hist_gradient_boosting:
      max_iter: 30
      learning_rate: 0.1
      max_depth: 4
      min_samples_leaf: 20
    xgboost:
      n_estimators: 30
      max_depth: 3
      learning_rate: 0.1
      subsample: 0.9
      colsample_bytree: 0.9
      min_child_weight: 1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: ./mlartifacts
  experiment_name: payguard-fraud-ci
  registered_model_name: payguard-fraud-detector-ci

monitoring:
  psi_bins: 8
  feature_psi_threshold: 0.2
  prediction_psi_threshold: 0.1
  min_features_drifted: 2
  drift_rows: 600

output:
  model_path: models/ci/model.joblib
  metrics_path: reports/ci/metrics.json
  shap_path: reports/ci/shap_summary.json
  drift_json_path: reports/ci/drift_report.json
  drift_md_path: reports/ci/drift_report.md
  plots_dir: reports/ci/plots
