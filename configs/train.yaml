seed: 42

data:
  source: synthetic
  n_rows: 30000
  target_fraud_rate: 0.02
  output_path: data/raw/transactions.csv
  # Optional. source: url tries this download, then falls back to synthetic.
  url: https://example.invalid/payguard-transactions.csv
  download_path: data/raw/downloaded.csv
  timeout_seconds: 20

split:
  test_size: 0.2

training:
  cv_folds: 5
  # 0.40 is the review-queue bar. A 0.70 bar is reachable on this data only in
  # the extreme tail, where a few dozen alerts make the threshold unstable.
  precision_target: 0.40
  shap_sample_size: 1500
  models:
    logistic_regression:
      C: 1.0
      max_iter: 400
    hist_gradient_boosting:
      max_iter: 120
      learning_rate: 0.08
      max_depth: 6
      min_samples_leaf: 30
    xgboost:
      n_estimators: 160
      max_depth: 4
      learning_rate: 0.08
      subsample: 0.9
      colsample_bytree: 0.9
      min_child_weight: 4

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: ./mlartifacts
  experiment_name: payguard-fraud
  registered_model_name: payguard-fraud-detector

monitoring:
  psi_bins: 10
  feature_psi_threshold: 0.2
  prediction_psi_threshold: 0.1
  min_features_drifted: 2
  drift_rows: 4000

output:
  model_path: models/model.joblib
  metrics_path: reports/metrics.json
  shap_path: reports/shap_summary.json
  drift_json_path: reports/drift_report.json
  drift_md_path: reports/drift_report.md
  plots_dir: reports/plots
