seed: 42

data:
  # Full ULB credit-card table via OpenML. No login. The published metrics
  # come from this source. A failed download uses the committed CI sample,
  # then the synthetic generator.
  source: openml
  openml_id: 1597
  fallback_csv: data/samples/creditcard_ci.csv
  cache_path: data/raw/creditcard.pq
  output_path: data/raw/creditcard.csv
  n_rows: 2000
  target_fraud_rate: 0.02

split:
  test_size: 0.2

training:
  cv_folds: 5
  precision_target: 0.50
  shap_sample_size: 1500
  models:
    logistic_regression:
      C: 1.0
      max_iter: 500
    hist_gradient_boosting:
      max_iter: 150
      learning_rate: 0.08
      max_depth: 6
      min_samples_leaf: 40
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.08
      subsample: 0.9
      colsample_bytree: 0.8
      min_child_weight: 4

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: ./mlartifacts
  experiment_name: payguard-fraud
  registered_model_name: payguard-fraud-detector

monitoring:
  psi_bins: 10
  feature_psi_threshold: 0.2
  prediction_psi_threshold: 0.1
  min_features_drifted: 2
  drift_rows: 4000

output:
  model_path: models/model.joblib
  metrics_path: reports/metrics.json
  shap_path: reports/shap_summary.json
  drift_json_path: reports/drift_report.json
  drift_md_path: reports/drift_report.md
  plots_dir: reports/plots
